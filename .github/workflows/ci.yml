name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Set target framework
      id: framework
      run: |
        case "${{ matrix.dotnet-version }}" in
          "8.0.x") echo "tfm=net8.0" >> $GITHUB_OUTPUT ;;
          "9.0.x") echo "tfm=net9.0" >> $GITHUB_OUTPUT ;;
          "10.0.x") echo "tfm=net10.0" >> $GITHUB_OUTPUT ;;
        esac

    - name: Build
      run: dotnet build --no-restore --configuration Release --framework ${{ steps.framework.outputs.tfm }}

    - name: Test
      run: dotnet test --no-build --configuration Release --framework ${{ steps.framework.outputs.tfm }} --verbosity normal --settings coverlet.runsettings

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool || true

    - name: Generate Coverage Report and Check Threshold
      run: |
        reportgenerator -reports:'tests/**/coverage.opencover.xml' -targetdir:'coverage-report' -reporttypes:'TextSummary' "-classfilters:-Microsoft.AspNetCore.OpenApi.Generated*;-System.Runtime.CompilerServices*"
        coverage=$(grep -oP 'Line coverage: \K[0-9.]+' coverage-report/Summary.txt | head -1)
        echo "Line coverage: ${coverage}%"
        if (( $(echo "$coverage < 95" | bc -l) )); then
          echo "Error: Line coverage ${coverage}% is below the required 95%"
          exit 1
        fi
        echo "Coverage check passed: ${coverage}% >= 95%"

  auto-tag:
    name: Auto-create version tag
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT_TOKEN || github.token }}

    - name: Extract version from Directory.Build.props
      id: version
      run: |
        VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Directory.Build.props)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Check if tag exists
      id: check_tag
      run: |
        if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Tag v${{ steps.version.outputs.version }} already exists"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Tag v${{ steps.version.outputs.version }} does not exist"
        fi

    - name: Create and push tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"
        echo "✅ Created and pushed tag v${{ steps.version.outputs.version }}"

    - name: Tag already exists
      if: steps.check_tag.outputs.exists == 'true'
      run: echo "ℹ️ Tag v${{ steps.version.outputs.version }} already exists, skipping tag creation"
